name: Docs

on:
  push:
    branches:
      - main

# Deploys must not overlap; let an in-flight deploy finish.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  build:
    uses: steamwiz/actions/.github/workflows/mdbook-build.yml@v1
    with:
      # Pinned: theme/index.hbs is a customized mdBook 0.4 template, and
      # mdBook 0.5 can't render it (or parse book.toml's `multilingual`).
      mdbook-version: '0.4.49'
      output-dir: html

  deploy:
    needs: build
    uses: steamwiz/actions/.github/workflows/cloudflare-deploy.yml@v1
    with:
      cloudflare-project-name: steamwiz-www
      directory: .
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
